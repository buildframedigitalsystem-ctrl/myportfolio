<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Business System Guide | BuildFrame</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 20px;
            color: #475569;
        }

        .checklist {
            margin-bottom: 25px;
        }

        .checklist label {
            display: block;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Business System Self-Assessment</h1>
        <p>
            Before building anything, check what your business is missing.
            Most businesses operate without proper systems.
        </p>

        <div class="checklist">
            <label><input type="checkbox"> I have a proper website</label>
            <label><input type="checkbox"> I capture all inquiries automatically</label>
            <label><input type="checkbox"> Clients can book without messaging me</label>
            <label><input type="checkbox"> I track all leads in one place</label>
            <label><input type="checkbox"> I have automated follow-ups</label>
            <label><input type="checkbox"> I have a structured content system</label>
        </div>

        <p>
            Get your free guide and see what system fits your business.
        </p>

        <form id="guideForm">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>

            <select name="type">
                <option value="">What are you planning to build?</option>
                <option>Website</option>
                <option>Funnel</option>
                <option>Platform</option>
                <option>Not Sure Yet</option>
            </select>

            <button type="submit">Get Free Guide</button>
        </form>

    </div>

    <script>
        document.getElementById("guideForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            const data = {
                name: formData.get("name"),
                email: formData.get("email"),
                type: formData.get("type"),
                source: "Free Guide"
            };

            fetch("https://script.google.com/macros/s/AKfycbzHDuGpavarBXBDQJZNRQn8iu_CZynZu5KQJYKy_v_cBco_7IEsSToev-p1m1tO0fp2/exec", {
                method: "POST",
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(response => {
                    alert("Guide sent! Check your email soon.");
                    document.getElementById("guideForm").reset();
                })
                .catch(err => {
                    alert("Something went wrong.");
                    console.error(err);
                });
        });
    </script>

</body>

</html>
