<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business System Assessment | BuildFrame</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #07111f, #0f172a);
            color: #f8fafc;
            padding: 40px 20px;
        }

        .assessment-wrap {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 34px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: #7fd1ff;
            text-decoration: none;
            font-weight: 700;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        .intro {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1rem;
        }

        option {
            color: #0f172a;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checklist {
            display: grid;
            gap: 10px;
            margin-top: 10px;
        }

        .checklist label {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-weight: 400;
            color: #dbeafe;
            line-height: 1.5;
        }

        .checklist input {
            width: auto;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #4ea1ff, #6ee7f9);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }

        .note {
            margin-top: 16px;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="assessment-wrap">
        <a href="index.html" class="back-link">← Back to BuildFrame</a>

        <h1>Business System Assessment</h1>

        <p class="intro">
            This is not just a signup form. This helps us understand what your business may need:
            a website, funnel, platform, automation, or a more complete operating system.
        </p>

        <form id="assessmentForm">

            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Business / Brand Name</label>
                <input type="text" name="business" placeholder="Enter your business name">
            </div>

            <div class="form-group">
                <label>Industry / Business Type</label>
                <input type="text" name="industry"
                    placeholder="Example: construction, rentals, clinic, store, nonprofit">
            </div>

            <div class="form-group">
                <label>What are you interested in?</label>
                <select name="type" required>
                    <option value="">Choose one</option>
                    <option>Website</option>
                    <option>Funnel</option>
                    <option>Platform</option>
                    <option>Automation</option>
                    <option>Not sure yet</option>
                </select>
            </div>

            <div class="form-group">
                <label>What does your business currently need help with?</label>

                <div class="checklist">
                    <label><input type="checkbox" name="needs" value="No proper website"> I don’t have a proper website
                        yet</label>
                    <label><input type="checkbox" name="needs" value="Lead capture"> I don’t capture inquiries
                        properly</label>
                    <label><input type="checkbox" name="needs" value="Manual booking"> I still handle bookings or
                        messages manually</label>
                    <label><input type="checkbox" name="needs" value="No follow-up automation"> I don’t have automated
                        follow-ups</label>
                    <label><input type="checkbox" name="needs" value="No customer tracking"> I don’t track leads or
                        customers properly</label>
                    <label><input type="checkbox" name="needs" value="Need structured system"> I want a more structured
                        business system</label>
                </div>
            </div>

            <div class="form-group">
                <label>Tell us about your current setup</label>
                <textarea name="message"
                    placeholder="Briefly describe what you have now and what you want to improve."></textarea>
            </div>

            <button type="submit">Submit My Assessment</button>

            <p class="note">
                Your answers will help BuildFrame recommend the right starting point.
            </p>

        </form>
    </main>

    <script>
        document.getElementById("assessmentForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            const selectedNeeds = [];
            document.querySelectorAll('input[name="needs"]:checked').forEach(item => {
                selectedNeeds.push(item.value);
            });

            const data = {
                name: formData.get("name"),
                email: formData.get("email"),
                business: formData.get("business"),
                industry: formData.get("industry"),
                type: formData.get("type"),
                message: formData.get("message"),
                needs: selectedNeeds.join(", "),
                source: "Business System Assessment"
            };

            fetch("https://script.google.com/macros/s/AKfycbzHDuGpavarBXBDQJZNRQn8iu_CZynZu5KQJYKy_v_cBco_7IEsSToev-p1m1tO0fp2/exec", {
                method: "POST",
                body: JSON.stringify(data)
            })
                .then(res => res.json())
                .then(response => {
                    window.location.href = "thank-you.html";
                    document.getElementById("assessmentForm").reset();
                })
                .catch(error => {
                    alert("Something went wrong. Please try again.");
                    console.error(error);
                });
        });
    </script>

    <script src="ai/ai-loader.js"></script>

</body>

</html>
